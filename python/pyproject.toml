[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrofacet-renewal"
version = "0.1.0"
description = "Censored sequence likelihood training for Renewal+ GPIS"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.24"]

[project.scripts]
macrofacet-renewal = "renewal.cli:main"

[tool.setuptools.packages.find]
include = ["renewal*"]
